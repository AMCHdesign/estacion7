<style>
:root{
  --navy:#071820;--deep:#0d2c3a;--teal:#15485e;
  --gold:#c9a227;--gold-lt:#dbb82e;--aqua:#5ec4c8;
  --light:#edf1f2;--muted:rgba(237,241,242,.52);
  --f:'Kanit',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:var(--f);background:var(--navy);color:var(--light);overflow:hidden}

/* FOTO DE FONDO — assets/img/que-es.jpg */
.bg-photo{
  position:fixed;inset:0;z-index:0;
  background-image:url('assets/img/que-es.jpg');
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
}
.bg-photo::after{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(7,24,32,.65) 0%,rgba(7,24,32,.48) 45%,rgba(7,24,32,.75) 100%),
    radial-gradient(ellipse 80% 85% at 50% 50%,transparent 0%,rgba(7,24,32,.5) 100%);
}

/* SVG ART — sutil encima de la foto */
.bg-art{position:fixed;inset:0;z-index:1;opacity:.05;pointer-events:none;overflow:hidden}

/* ANILLOS AMBIENTAL */
.pulse-ring{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(94,196,200,.07);
  pointer-events:none;z-index:1;animation:pulse 5s ease-in-out infinite;
}
.pr1{width:460px;height:460px}
.pr2{width:720px;height:720px;animation-delay:1.6s}
.pr3{width:1020px;height:1020px;animation-delay:3.2s}

/* SCANLINES */
.scanlines{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);
}

/* CANVAS */
.canvas{
  position:fixed;inset:0;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px 40px;
}

/* LOGO */
.logo-wrap{
  margin-bottom:clamp(24px,4.5vh,48px);
  opacity:0;animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .15s forwards;
}
.logo-wrap img{
  height:clamp(32px,4.5vw,48px);width:auto;display:block;
  filter:drop-shadow(0 2px 14px rgba(0,0,0,.6));
}

/* EYEBROW */
.eyebrow{
  font-weight:300;font-size:clamp(.62rem,.9vw,.78rem);
  letter-spacing:.32em;text-transform:uppercase;color:var(--gold);
  margin-bottom:clamp(12px,2vh,18px);
  opacity:0;animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .32s forwards;
}

/* TITULAR */
.headline{
  font-weight:900;font-size:clamp(2.8rem,8.5vw,5.8rem);
  line-height:.96;letter-spacing:-.035em;text-align:center;
  text-shadow:0 2px 24px rgba(0,0,0,.45);
  margin-bottom:clamp(32px,5.5vh,54px);
  opacity:0;animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .48s forwards;
}
.headline .g{color:var(--gold)}
.headline .a{color:var(--aqua)}

/* COUNTDOWN */
.countdown{
  display:flex;align-items:flex-start;gap:clamp(5px,1.2vw,10px);
  margin-bottom:clamp(10px,1.5vh,18px);
  opacity:0;animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .62s forwards;
}
.cd-unit{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1vh,10px)}
.cd-box{
  min-width:clamp(68px,15vw,120px);
  padding:clamp(12px,2.5vh,20px) clamp(8px,2vw,14px);
  background:rgba(7,24,32,.52);
  backdrop-filter:blur(24px) saturate(1.3);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);
  border:1px solid rgba(94,196,200,.18);border-radius:clamp(12px,1.8vw,18px);
  position:relative;overflow:hidden;
}
.cd-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(94,196,200,.38),transparent);
}
.cd-box::after{
  content:'';position:absolute;bottom:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,162,39,.12),transparent);
}
.cd-num{
  font-weight:800;font-size:clamp(2.4rem,6.5vw,4.6rem);
  line-height:1;letter-spacing:-.04em;color:var(--gold);
  font-variant-numeric:tabular-nums;text-align:center;display:block;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1);
}
.cd-num.tick{transform:scale(1.1) translateY(-2px)}
.cd-label{
  font-weight:300;font-size:clamp(.5rem,1vw,.66rem);
  letter-spacing:.22em;text-transform:uppercase;
  color:rgba(237,241,242,.42);text-align:center;
}
.cd-sep{
  font-weight:200;font-size:clamp(1.8rem,5vw,4rem);
  color:rgba(94,196,200,.38);line-height:1;
  align-self:flex-start;margin-top:clamp(12px,2.5vh,20px);user-select:none;
}

/* FECHA */
.launch-date{
  font-weight:300;font-size:clamp(.6rem,.85vw,.74rem);
  letter-spacing:.2em;text-transform:uppercase;color:rgba(237,241,242,.35);
  margin-bottom:clamp(28px,5vh,50px);
  opacity:0;animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .78s forwards;
}
.launch-date em{font-style:normal;color:rgba(201,162,39,.7)}

/* SOCIAL */
.social{
  display:flex;gap:10px;align-items:center;
  opacity:0;animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .92s forwards;
}
.soc-btn{
  width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(94,196,200,.22);background:rgba(7,24,32,.48);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  color:var(--light);text-decoration:none;
  transition:border-color .22s,background .22s,transform .18s,color .22s;
}
.soc-btn:hover{border-color:var(--gold);background:rgba(201,162,39,.18);color:var(--gold);transform:translateY(-3px)}
.soc-btn svg{width:17px;height:17px;fill:currentColor;display:block}

/* ESTADO LANZADO */
#launchedMsg{display:none;flex-direction:column;align-items:center;gap:18px;text-align:center}
#launchedMsg.show{display:flex}
.launched-icon{font-size:3rem;line-height:1}
.launched-h{font-weight:900;font-size:clamp(2rem,6vw,4rem);letter-spacing:-.03em;color:var(--gold);text-shadow:0 2px 20px rgba(0,0,0,.5)}
.launched-p{color:var(--muted);font-weight:300}
.btn-launch{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--f);font-weight:700;font-size:.95rem;letter-spacing:.04em;
  padding:15px 36px;border-radius:50px;background:var(--gold);color:var(--navy);
  border:none;cursor:pointer;text-decoration:none;margin-top:6px;
  transition:background .2s,transform .15s,box-shadow .2s;
  box-shadow:0 8px 28px rgba(201,162,39,.32);
}
.btn-launch:hover{background:var(--gold-lt);transform:translateY(-2px);box-shadow:0 14px 36px rgba(201,162,39,.42)}

/* ANIMACIONES */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(22px);filter:blur(7px)}
  to  {opacity:1;transform:translateY(0);filter:blur(0)}
}
@keyframes pulse{
  0%,100%{opacity:.18;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:.06;transform:translate(-50%,-50%) scale(1.04)}
}

/* RESPONSIVE */
@media(max-width:480px){
  .headline{font-size:clamp(2.4rem,11vw,3.2rem)}
  .countdown{gap:4px}
  .bg-photo{background-position:60% center}
}
@media(max-height:620px){
  .headline{margin-bottom:20px}
  .launch-date{margin-bottom:20px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

<script>
/* TARGET: Viernes 19 junio 2026, 19:00 CLT = UTC-4 → 23:00 UTC */
const TARGET = new Date('2026-06-19T23:00:00Z');

function pad(n){ return String(n).padStart(2,'0') }

function updateUnit(id, val){
  const el = document.getElementById(id);
  if (!el) return;
  const txt = pad(val);
  if (el.textContent !== txt){
    el.textContent = txt;
    el.classList.remove('tick');
    void el.offsetWidth;
    el.classList.add('tick');
    setTimeout(function(){ el.classList.remove('tick') }, 220);
  }
}

function tick(){
  var diff = TARGET.getTime() - Date.now();
  if (diff <= 0){
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('launchedMsg').classList.add('show');
    clearInterval(timer);
    return;
  }
  var s = Math.floor(diff / 1000);
  updateUnit('cd-d', Math.floor(s / 86400));
  updateUnit('cd-h', Math.floor((s % 86400) / 3600));
  updateUnit('cd-m', Math.floor((s % 3600) / 60));
  updateUnit('cd-s', s % 60);
}

var timer = setInterval(tick, 1000);
tick();
</script>
